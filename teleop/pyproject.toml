[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "Apache-2.0"}
name = "gello-remote"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["robot-data-contracts==0.2.0", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
isaaclab = ["websockets==17.0.1"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gello-remote-genesis = "gello_remote.genesis_worker:main"
gello-remote-genesis-policy-rollout = "gello_remote.genesis_policy_rollout:main"
gello-remote-isaaclab-smoke = "gello_remote.isaaclab_smoke:main"
gello-remote-isaaclab = "gello_remote.isaaclab_gello:main"

[tool.setuptools.package-data]
gello_remote = ["web/*.html", "web/*.mjs", "web/genesis/*", "web/console/*.html", "web/console/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gello_remote*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/gello-remote/legal" = ["../LICENSE", "../NOTICE", "../THIRD_PARTY_NOTICES.md"]
