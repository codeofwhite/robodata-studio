  <text x="60.0" y="757.0" font-size="18" fill="#9CB3C5" text-anchor="start">SOLID  Runtime / data flow      DASHED  Schema dependency</text>
  <text x="60.0" y="800.0" font-size="18" fill="#9CB3C5" text-anchor="start">The API orchestrates workers; each worker owns its control loop. Contracts have no SDK or database dependency.</text>
  <text x="60.0" y="833.0" font-size="18" fill="#9CB3C5" text-anchor="start">SDKs, robot assets and the optional WebRTC console are configured separately. No training job is launched by export.</text>
